name: Test Training

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - run: |
          printf 'torch==2.7.1\n' > "$RUNNER_TEMP/torch-constraints.txt"
          python -m pip install -c "$RUNNER_TEMP/torch-constraints.txt" -r requirements-colab.txt 'numpy>=2' pytest
      - run: python -m pytest -q
      - name: Train and export a small synthetic model
        run: |
          python scripts/make_synthetic.py --out "$RUNNER_TEMP/data"
          python - "$RUNNER_TEMP/profile.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          controls = [
              dict(id=key, label=label, min=0, max=10, default=5, model_min=0, model_max=1)
              for key, label in (("gain", "Gain"), ("treble", "Treble"))
          ]
          Path(sys.argv[1]).write_text(json.dumps(dict(amplifier="CI amp", controls=controls)))
          PY
          python run_training.py --manifest "$RUNNER_TEMP/data/manifest.json" \
            --profile "$RUNNER_TEMP/profile.json" --out "$RUNNER_TEMP/run" --device cpu \
            --steps 1 --batch-size 1 --val-every 1 --checkpoint-every 1
          test -s "$RUNNER_TEMP/run/model.pnam"
      - name: Package notebook and trainer
        run: |
          cmake -E tar cf ParametricNAM-Training.zip --format=zip ParametricNAM_Colab.ipynb README.md LICENSE \
            run_training.py train_param.py export_pnam.py requirements-colab.txt nam_param profiles
      - uses: actions/upload-artifact@v6
        with:
          name: Training
          path: ParametricNAM-Training.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Training
          path: packages
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create --repo "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" --verify-tag --generate-notes packages/*.zip
